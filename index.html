async function requestTranscription(data){

 if(!body.job_id)return body;
 let lastStage="";
 for(;;){
  const poll=await fetch("/api/transcribe/"+encodeURIComponent(body.job_id),{credentials:"same-origin",headers:{Accept:"application/json"}});let state={};try{state=await poll.json()}catch(e){}
  if(!poll.ok)throw new Error(state.detail||("Transcription job returned "+poll.status));
  if(state.status==="complete")return state;
  if(state.status==="error")throw new Error(state.detail||"Local transcription failed.");
   const stage=String(state.stage||state.status||"processing");if(stage!==lastStage){REC.msg="Transcribing with "+(REC.provider||"the configured service")+"… "+stage+". Keep this tab open.";render();lastStage=stage}
  await new Promise(r=>setTimeout(r,1200));
 }
}
